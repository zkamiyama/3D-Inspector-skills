name: Inspector Skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: |
          python -m pip install -r skills/chat-3d-viewer/requirements.txt
          python -m pip install "DracoPy>=2.2,<3" usd-core "cadquery-ocp-novtk>=7.8.1.1,<8"
          npm ci
      - name: Rebuild and check vendored Three.js runtime
        run: |
          npm run bundle
          git diff --exit-code -- skills/chat-3d-viewer/assets/
      - name: Unit tests
        run: |
          python -m unittest discover -s skills/chat-3d-viewer/tests -p 'test_*.py'
          node tests/camera.mjs
      - name: Generate and verify packaged Skill
        run: |
          python tools/package_skill.py
          git diff --exit-code -- chat-3d-viewer-skill.zip
      - name: Render models and exercise controls in Chromium
        run: |
          node --check tests/cdn_probe.mjs
          npx playwright install --with-deps chromium
          python tests/make_previews.py
          npm run test:browser -- --webgpu .test-output/synthetic-native.html .test-output/material-native.html .test-output/animated.html .test-output/cloud.html .test-output/gaussian.html .test-output/gaussian-ply.html
          npm run test:browser -- --mobile --disable-webgpu .test-output/synthetic-native.html .test-output/material-native.html .test-output/gaussian-ply.html
          npm run test:browser -- --reject-webgpu .test-output/material-native.html
          npm run test:browser -- --disable-webgl .test-output/synthetic-native.html .test-output/cloud.html .test-output/gaussian.html .test-output/gaussian-ply.html
