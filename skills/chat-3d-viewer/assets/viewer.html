<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>3D Inspector</title>
<!-- Third-party notices for the bundled renderer:\n__THIRD_PARTY_LICENSES__\n-->
<style>
:root{color-scheme:dark;--bg:#151718;--surface:#1b1d1e;--raised:#262829;--border:rgba(243,243,238,.10);--text:#e9ebea;--secondary:#b3b8b7;--muted:#939a99;--accent:#c8a77a;--font:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 var(--font)}
button,select,input{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
[hidden]{display:none!important}
.inspector-shell{position:relative;height:min(900px,100dvh);min-height:420px;max-width:1600px;margin:auto;overflow:hidden;background:var(--bg)}
.workbench{height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 252px}
.left-pane{position:relative;min-width:0;min-height:0;background:#181a1b}
.stage{position:absolute;inset:0;overflow:hidden;background:#181a1b}
.stage.grid-on{background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:24px 24px}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.tools{position:absolute;z-index:5;top:8px;left:8px;max-width:calc(100% - 16px);width:max-content;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;background:rgba(22,24,25,.90);border:1px solid rgba(238,240,240,.12);border-radius:10px;box-shadow:0 5px 18px rgba(0,0,0,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tool-button,.icon-button{height:28px;min-width:29px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 7px;border:0;border-radius:6px;color:var(--secondary);background:transparent;font-size:11px;white-space:nowrap}
.tool-button:hover,.icon-button:hover{background:#303334;color:var(--text)}
.tool-button[aria-pressed=true]{background:#343331;color:#f3dcc0}
.tool-button[data-command=fit]{color:var(--text)}
.tool-button svg,.icon-button svg{width:15px;height:15px;stroke-width:1.7}
.icon-button{width:28px;padding:0}
.tool-sep{height:17px;width:1px;margin:0 4px;background:rgba(238,240,240,.16);flex-shrink:0}
.view-menu{display:flex;align-items:center;gap:1px;border:1px solid rgba(238,240,240,.10);border-radius:7px;padding:2px}
.view-menu .tool-button{height:24px;min-width:30px;padding:0 5px;font:10px/1 var(--mono)}
.view-menu .tool-button[aria-pressed=true]{background:#383632}
.viewport-info{position:absolute;bottom:10px;left:10px;z-index:2;max-width:calc(100% - 95px);padding:7px 10px;background:rgba(20,22,23,.83);border:1px solid rgba(238,240,240,.08);border-radius:8px;pointer-events:none;backdrop-filter:blur(6px)}
.viewport-name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewport-sub{font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewport-status{display:flex;align-items:center;gap:6px;margin-top:4px;font:10px/1.4 var(--mono);color:var(--muted);flex-wrap:wrap}
.viewport-status #stage-faces:empty{display:none}
.status-dot{display:inline-block;flex-shrink:0;width:6px;height:6px;border-radius:50%;background:#aeb7af}
.status-dot.error{background:#df8678}
.axis{position:absolute;bottom:9px;right:12px;pointer-events:none;width:52px;height:52px;opacity:.65}
.axis svg{width:100%;height:100%}
.right-pane{border-left:1px solid var(--border);min-width:0;min-height:0;display:flex;flex-direction:column;background:#191b1c}
.tabs{display:flex;flex:0 0 34px;height:34px;align-items:stretch;gap:8px;padding:0 8px;border-bottom:1px solid var(--border)}
.tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);height:34px;padding:0 6px;font-size:11px}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{border-bottom-color:var(--accent);color:var(--text)}
.panel{min-height:0;overflow-y:auto;flex:1;padding:9px 10px;scrollbar-width:thin}
.panel[hidden]{display:none}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-bottom:12px}
.stat{padding:6px 8px;background:#222425;border:1px solid rgba(238,240,240,.07);border-radius:6px;min-width:0}
.stat-number{display:block;line-height:21px;font:500 18px/21px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-label{display:block;margin-top:1px;color:var(--muted);font-size:10px}
.section-title{font-size:11px;font-weight:500;margin:0 0 4px;color:var(--secondary)}
.muted{color:var(--muted)}
.details-list{margin:0 0 12px}
.details-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(238,240,240,.07);padding:5px 0;font-size:11px}
.details-row dt{color:var(--muted);white-space:nowrap}
.details-row dd{color:var(--secondary);margin:0;min-width:0;text-align:right;overflow-wrap:anywhere;font:10px/1.4 var(--mono)}
.hierarchy{display:flex;flex-direction:column;gap:0}
.mesh-row{min-height:27px;display:flex;align-items:center;gap:6px;padding:2px 3px;border-radius:4px;font-size:11px}
.mesh-row:hover{background:#252828}
.mesh-row input{width:13px;height:13px;margin:0;accent-color:var(--accent);cursor:pointer}
.mesh-row label{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mesh-row small{font:9px/1.2 var(--mono);color:var(--muted);white-space:nowrap}
.note{background:transparent;color:var(--muted);border-top:1px solid var(--border);padding:7px 0 0;margin:8px 0 0;font-size:10px;line-height:1.4}
.material-card{width:100%;text-align:left;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:6px;padding:7px 8px;margin-bottom:5px}
.material-card:hover{background:#252828}
.material-card[aria-pressed=true]{border-color:#7f6b50;background:#292825}
.material-head{display:flex;align-items:center;gap:7px}
.swatch{width:21px;height:21px;flex-shrink:0;border-radius:4px;border:1px solid rgba(255,255,255,.15)}
.mat-name{font-size:11px;font-weight:500;overflow-wrap:anywhere}
.mat-summary{color:var(--muted);font:10px/1.5 var(--mono)}
.material-extra{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:5px;margin-top:7px;padding-top:7px;border-top:1px solid var(--border);color:var(--secondary);font-size:10px}
.material-extra span:nth-child(even){text-align:right;overflow-wrap:anywhere;font-family:var(--mono)}
.texture-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;max-height:188px;overflow:auto;margin-bottom:8px}
.texture-option{display:flex;align-items:center;gap:5px;min-width:0;padding:3px;border:1px solid transparent;border-radius:5px;background:transparent;text-align:left;color:var(--text)}
.texture-option:hover{background:#252828}
.texture-option[aria-pressed=true]{background:#292825;border-color:#685743}
.texture-thumb{height:29px;width:29px;flex-shrink:0;object-fit:contain;border-radius:3px;background:#303233}
.texture-info{min-width:0;flex:1}
.texture-name{font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.texture-subtitle{font:9px/1.25 var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.texture-stage{border:1px solid var(--border);border-radius:6px;overflow:hidden;aspect-ratio:1;background:#292b2c;display:grid;place-items:center}
.texture-stage canvas{width:100%;height:100%;object-fit:contain}
.texture-tools{display:flex;align-items:center;gap:8px;margin:7px 0}
.texture-tools label,.checkbox-label{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--secondary)}
.texture-tools select{padding:3px 5px;background:var(--raised);color:var(--text);border:1px solid var(--border);border-radius:5px;font:10px var(--mono)}
.texture-tools input{accent-color:var(--accent)}
.texture-details{font:10px/1.4 var(--mono);color:var(--muted)}
.no-results{font-size:11px;line-height:1.4;color:var(--muted);padding:6px 0}
#error{display:none;position:absolute;z-index:20;top:8px;right:266px;max-width:360px;background:#332b28;color:#f2afa4;border:1px solid #624238;border-radius:6px;padding:8px 10px;font-size:11px}
#error.visible{display:block}
.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}
@media(max-width:800px){.workbench{grid-template-columns:minmax(0,1fr) 230px}.panel{padding:8px}.tabs{padding:0 6px;gap:4px}#error{right:240px}}
@media(max-width:650px){.inspector-shell{height:auto;min-height:0}.workbench{display:flex;flex-direction:column}.left-pane{height:390px;min-height:390px;flex:0 0 auto}.right-pane{border-left:0;border-top:1px solid var(--border);min-height:0;max-height:none}.panel{overflow:visible}.tools{top:6px;left:6px;max-width:calc(100% - 12px);gap:1px;padding:3px}.tool-button{height:27px;padding:0 5px}.view-menu .tool-button{padding:0 4px;min-width:27px}.tool-sep{margin:0 2px}.viewport-info{bottom:7px;left:7px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{padding:6px}.stat-number{font-size:16px}.texture-list{max-height:180px}#error{right:8px;left:8px;max-width:none}}
@media(max-width:390px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.tool-button{font-size:10px}.tool-sep{display:none}}
</style>
</head>

</div>

</div>
</div>
<aside class="right-pane" aria-label="Asset inspector">
<div class="tabs" role="tablist" aria-label="Inspector panels"><button class="tab" id="tab-details" data-tab="details" type="button" aria-selected="true" role="tab">Details</button><button class="tab" id="tab-materials" data-tab="materials" type="button" aria-selected="false" role="tab">Materials</button><button class="tab" id="tab-textures" data-tab="textures" type="button" aria-selected="false" role="tab">Textures</button></div>
<div class="panel" id="panel-details" role="tabpanel" aria-labelledby="tab-details"><div class="stats"><div class="stat"><span class="stat-number" id="stat-vertices">—</span><span class="stat-label">Vertices</span></div><div class="stat"><span class="stat-number" id="stat-triangles">—</span><span class="stat-label">Triangles</span></div><div class="stat"><span class="stat-number" id="stat-meshes">—</span><span class="stat-label">Meshes</span></div><div class="stat"><span class="stat-number" id="stat-materials">—</span><span class="stat-label">Materials</span></div></div><h2 class="section-title">Asset properties</h2><dl class="details-list" id="properties"></dl><h2 class="section-title">Scene hierarchy</h2><div class="hierarchy" id="mesh-list"></div><div class="note" id="asset-note" hidden></div></div>

</aside>
</div>

</div>

function buttonPressed(id,value){$(id).setAttribute('aria-pressed',String(value));}
function setTab(name){for(const b of document.querySelectorAll('[data-tab]'))b.setAttribute('aria-selected',String(b.dataset.tab===name));for(const id of ['details','materials','textures'])$('panel-'+id).hidden=id!==name;}

function infoRow(k,v){const el=newText('div','', 'details-row');el.append(newText('dt',k),newText('dd',v));return el;}
function buildUI(){document.title=scene.name+' — 3D Inspector';$('asset-title').textContent=scene.name;$('asset-subtitle').textContent=scene.format+' · '+(scene.description||'3D asset');const boxNative=render?.native?.isBox===true,verts=boxNative?24:meshes.reduce((a,m)=>a+m.positions.length/3,0),tris=boxNative?12:meshes.reduce((a,m)=>a+m.indices.length/3,0);for(const[k,n]of Object.entries({vertices:verts,triangles:tris,meshes:boxNative?1:meshes.length,materials:materials.length}))$('stat-'+k).textContent=format(n);$('stage-faces').textContent=boxNative?'':scene.previewType==='surface'?'Sampled surface':'';
const dims=scene.bounds.max.map((n,i)=>n-scene.bounds.min[i]);const properties=$('properties');for(const[k,v]of [['Format',scene.format],['Dimensions',dims.map(x=>Number(x.toFixed(3))).join(' × ')],['Source vertices',scene.original?.vertices==null?'—':format(scene.original.vertices)],['Source triangles',scene.original?.triangles==null?'—':format(scene.original.triangles)],['Texture maps',String(textures.length)],['Unit',scene.unit||'model']])properties.append(infoRow(k,v));

const list=$('mesh-list');if(boxNative){const row=newText('div','', 'mesh-row'),cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.id='native-box-visible';cb.addEventListener('change',()=>{render.native.setVisible(cb.checked);requestFrame();});const label=newText('label','Box ray-march volume');label.htmlFor=cb.id;row.append(cb,label,newText('small','12 bounds triangles'));list.append(row);}else for(let i=0;i<meshes.length;i++){const mesh=meshes[i],row=newText('div','', 'mesh-row'),id='mesh-visible-'+i,cb=document.createElement('input');cb.type='checkbox';cb.id=id;cb.checked=true;cb.addEventListener('change',()=>{mesh.visible=cb.checked;requestFrame();});const label=newText('label',mesh.name);label.htmlFor=id;row.append(cb,label,newText('small',format(mesh.indices.length/3)));list.append(row);}
$('mat-count').textContent=materials.length.toString();$('mat-empty').hidden=materials.length>0;const matList=$('material-list');for(let i=0;i<materials.length;i++){const mat=materials[i],card=newText('button','', 'material-card');card.type='button';card.setAttribute('aria-pressed','false');const header=newText('div','', 'material-head');const swatch=newText('span','', 'swatch');swatch.style.background='rgb('+mat.baseColor.slice(0,3).map(v=>Math.round(v*255)).join(',')+')';const nameBox=newText('div','');nameBox.append(newText('div',mat.name||'Material '+i,'mat-name'),newText('div',`${format(meshes.filter(m=>m.material===i).length)} meshes · ${(mat.alphaMode||'opaque').toLowerCase()}`,'mat-summary'));header.append(swatch,nameBox);card.append(header);const more=newText('div','', 'material-extra');const tx=id=>Number.isInteger(id)&&id>=0?textures[id]?.name||'None':'None';for(const[k,v]of [
['Metallic',mat.metallicSource||(mat.metallic??0)],['Roughness',mat.roughnessSource||(mat.roughness??1)],
['Base color',tx(mat.baseColorTexture)],['Normal',tx(mat.normalTexture)],
['Metal / rough',tx(mat.metallicRoughnessTexture)],['Emissive',tx(mat.emissiveTexture)],
['AO',tx(mat.occlusionTexture)],['Alpha',mat.alphaMode||'OPAQUE']
])more.append(newText('span',k),newText('span',String(v)));card.append(more);card.addEventListener('click',()=>{mode.isolated=mode.isolated===i?-1:i;for(const c of matList.children)c.setAttribute('aria-pressed',String(c===card&&mode.isolated===i));requestFrame();});matList.append(card);}
$('texture-count').textContent=textures.length.toString();$('texture-empty').hidden=textures.length>0;const txList=$('texture-list');for(let i=0;i<textures.length;i++){const tex=textures[i],b=newText('button','', 'texture-option');b.type='button';b.setAttribute('aria-pressed','false');const im=document.createElement('img');im.className='texture-thumb';im.src=tex.dataUri;im.alt='';const info=newText('div','', 'texture-info');info.append(newText('div',tex.name||'Texture '+i,'texture-name'),newText('div',`${tex.width}×${tex.height} · ${tex.role||'Image'}`,'texture-subtitle'));b.append(im,info);b.addEventListener('click',()=>selectTexture(i));txList.append(b);}if(textures.length)selectTexture(0);}
function selectTexture(i){textureSelected=i;for(let j=0;j<$('texture-list').children.length;j++)$('texture-list').children[j].setAttribute('aria-pressed',String(j===i));$('texture-editor').hidden=false;renderTexture();}
function renderTexture(){const tex=textures[textureSelected];if(!tex?.image)return;const dst=$('texture-canvas'),ctx=dst.getContext('2d',{willReadFrequently:true});if(!ctx)return;const scale=Math.min(1,512/Math.max(tex.width,tex.height));dst.width=Math.max(1,Math.round(tex.width*scale));dst.height=Math.max(1,Math.round(tex.height*scale));ctx.clearRect(0,0,dst.width,dst.height);ctx.drawImage(tex.image,0,0,dst.width,dst.height);const channel=$('channel').value;
if(channel!=='rgba'){const data=ctx.getImageData(0,0,dst.width,dst.height);for(let p=0;p<data.data.length;p+=4){const src=[...data.data.slice(p,p+4)];if(channel==='rgb')data.data[p+3]=255;else{const idx={r:0,g:1,b:2,a:3}[channel],c=src[idx];data.data[p]=data.data[p+1]=data.data[p+2]=c;data.data[p+3]=255;}}ctx.putImageData(data,0,0);}

$('texture-details').textContent=`${tex.width} × ${tex.height} · ${tex.role||'Image'} · ${tex.format||'PNG'}`;}
function setupEvents(){for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>setTab(b.dataset.tab);for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>chooseView(b.dataset.view);q('[data-command=fit]').onclick=fit;$('projection').onclick=()=>{camera.orthographic=!camera.orthographic;render?.native?.projection(camera.orthographic);buttonPressed('projection',camera.orthographic);requestFrame();};$('wireframe').onclick=()=>{mode.wire=!mode.wire;buttonPressed('wireframe',mode.wire);requestFrame();};$('normals').onclick=()=>{mode.normals=!mode.normals;buttonPressed('normals',mode.normals);requestFrame();};$('grid').onclick=()=>{mode.grid=!mode.grid;buttonPressed('grid',mode.grid);stage.classList.toggle('grid-on',mode.grid);};$('channel').onchange=renderTexture;$('uv-overlay').onchange=renderTexture;$('snapshot').onclick=()=>{try{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=(scene.name||'3d-inspector').replace(/[^\w-]+/g,'-')+'.png';a.click();}catch(err){showError('Unable to save screenshot: '+err.message);}};$('help').onclick=()=>alert('Orbit: drag\nPan: right-drag / shift-drag\nZoom: mouse wheel or trackpad\nF: frame asset\nW: wireframe\nN: surface normals\n1–6: camera views');
if(!render?.native){let pointer=null;canvas.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};canvas.setPointerCapture(e.pointerId);});canvas.oncontextmenu=e=>e.preventDefault();canvas.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer.x=e.clientX;pointer.y=e.clientY;if(pointer.pan){const k=camera.distance*.0015;const right=[Math.cos(camera.yaw),0,-Math.sin(camera.yaw)],up=[0,1,0];camera.pan=add(camera.pan,add(scale(right,-dx*k),scale(up,dy*k)));}else{camera.yaw-=dx*.008;camera.pitch=clamp(camera.pitch+dy*.008,-Math.PI*.495,Math.PI*.495);camera.chosen='';for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed','false');}requestFrame();});for(const evt of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(evt,()=>pointer=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.distance=clamp(camera.distance*Math.exp(e.deltaY*.001),scene.radius*.2,scene.radius*80);requestFrame();},{passive:false});}window.addEventListener('keydown',e=>{if(/input|select|textarea/i.test(document.activeElement?.tagName))return;const key=e.key.toLowerCase();if(key==='f'){fit();}if(key==='w')$('wireframe').click();if(key==='n')$('normals').click();if('123456'.includes(key))chooseView(['iso','front','back','left','right','top'][+key-1]);});window.addEventListener('resize',requestFrame);if('ResizeObserver'in window)new ResizeObserver(requestFrame).observe(canvas);}
function showError(text){$('error').textContent=text;$('error').classList.add('visible');$('state-dot').classList.add('error');$('stage-state').textContent='Unavailable';}
async function main(){
  try {
    scene=await decodeScene();
    scene.center=scene.bounds.min.map((x,i)=>(x+scene.bounds.max[i])/2);
    scene.radius=Math.hypot(...scene.bounds.max.map((x,i)=>x-scene.bounds.min[i]))/2||1;
    materials=scene.materials;textures=scene.textures;
    meshes=scene.meshes.map(m=>({
      ...m,positions:typed(m.positions,'f32'),indices:typed(m.indices,'u32'),
      normals:typed(m.normals,'f32'),uv:typed(m.uv,'f32'),
      colors:typed(m.colors,'u8'),fallbackColors:typed(m.fallbackColors,'u8'),visible:true
    }));
    if(!meshes.length)throw Error('The asset contains no triangle meshes');
    await initializeTextures();
    if(globalThis.ChatInspectorRuntimeReady){
      await globalThis.ChatInspectorRuntimeReady;
    }
    if(typeof ChatInspectorThree!=='undefined' && ChatInspectorThree.createThreeViewer){
      try{
        const viewer=await ChatInspectorThree.createThreeViewer({
          scene,canvas,meshes,materials,textures,onChange:requestFrame
        });
        render={native:viewer};
      }catch(err){
        render=null;
        console.warn('Native Three.js unavailable; using geometric fallback:',err);
      }
    }
    // A failed WebGL renderer may have claimed the canvas. Replace it so
    // Canvas2D remains available as a genuine offline fallback.
    if(!render && !canvas.getContext('2d')){
      const replacement=canvas.cloneNode(false);
      canvas.replaceWith(replacement);
      canvas=replacement;
    }
    buildUI();fit();setupEvents();
    $('render-state').textContent=render?.native?'Three.js / WebGL2':'Canvas 2D';
    $('stage-state').textContent=render?.native?.isBox?'Native Box':render?.native?'Three.js PBR':'Limited rendering';
    requestFrame();
    window.addEventListener('pagehide',()=>render?.native?.dispose(),{once:true});
  }catch(err){console.error(err);showError(err.message);}
}
main();
